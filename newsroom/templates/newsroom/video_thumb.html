{% comment %}
Thumbnail for one video. Parameters:
  video  - the Video
  play   - "" for no play button, "sm" or "lg" for one
  runtime - pass 0 where the runtime is already shown alongside
{% endcomment %}
<span class="gu-video-thumb">
    <img src="{{ video.thumbnail_url }}"
         onerror="this.onerror=null;this.src='{{ video.fallback_thumbnail_url }}';"
         alt="{{ video.thumbnail_alt }}"
         loading="lazy" />
    {% if play %}
        <span class="gu-video-play{% if play == 'lg' %} gu-video-play--lg{% endif %}">
            <span></span>
        </span>
    {% endif %}
    {% if video.duration and runtime != 0 %}
        <span class="gu-video-duration">{{ video.duration }}</span>
    {% endif %}
</span>
